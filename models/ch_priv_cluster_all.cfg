    SCENARIO = "bridge_all"
    PEEL = "amended"
    ONION = "per_packet"
    KEYS = "cluster"
    GRACE = 1
    REKEY_ON_LEAVE = FALSE
    OBSERVER = "none"
    ALLOW_ROTATE = FALSE
    ALLOW_LEAVE = FALSE
    Bad = {3}
    LATE = "none"
    MaxHops = 6
    HISTORY = TRUE
